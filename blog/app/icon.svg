<!-- Favicon del sitio (convención de Next: app/icon.svg → <link rel="icon">).
     Réplica del logo-mark del header: "J" blanca sobre el gradiente de marca
     (valores de - -grad en app/globals.css; SVG no puede leer CSS vars del sitio). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#6d3aed"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <text x="32" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff">J</text>
</svg>
